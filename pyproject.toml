[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-fortress"
version = "0.1.0"
description = "Public patent intelligence engine for white-space analysis and opportunity ranking"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kootamann" }]
license = { text = "Apache-2.0" }
dependencies = [
  "requests>=2.32.0",
  "pydantic>=2.8.2",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["app"]
